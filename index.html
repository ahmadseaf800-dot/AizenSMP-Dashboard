<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIZEN SMP — Security Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f5;font-family:Inter,system-ui,Arial}header{padding:24px 5%;border-bottom:1px solid #222;background:#0d0f15;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}.live{color:#55e38b}.wrap{max-width:1400px;margin:auto;padding:28px 5%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#11141b;border:1px solid #252a35;border-radius:14px;padding:20px}.num{font-size:32px;font-weight:800;margin-top:8px}.danger{color:#ff6262}.warn{color:#ffc857}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #242832;font-size:14px}th{color:#9da5b5}.pill{padding:4px 9px;border-radius:999px;background:#262b36}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}button{background:#e9b949;border:0;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}input{background:#11141b;border:1px solid #303644;color:white;padding:10px;border-radius:9px}.muted{color:#9da5b5}.empty{text-align:center;padding:30px;color:#8e96a6}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>⚔ AIZEN SMP</h1><div class="muted">Security & Server Dashboard</div></div><b class="live">● LIVE</b></header><main class="wrap"><div class="toolbar"><input id="api" placeholder="API URL (optional)" value="/api/stats"><button onclick="loadData()">Refresh</button></div><div class="grid"><div class="card"><div class="muted">Players Online</div><div id="online" class="num">—</div></div><div class="card"><div class="muted">Hack Flags</div><div id="flags" class="num danger">—</div></div><div class="card"><div class="muted">Kicks</div><div id="kicks" class="num warn">—</div></div><div class="card"><div class="muted">Bans</div><div id="bans" class="num danger">—</div></div><div class="card wide"><h2>⚠ Anti-Cheat Events</h2><table><thead><tr><th>Time</th><th>Player</th><th>Detection</th><th>Action</th></tr></thead><tbody id="events"></tbody></table></div><div class="card wide"><h2>👥 Players</h2><table><thead><tr><th>Player</th><th>Status</th><th>Last Detection</th><th>Violations</th></tr></thead><tbody id="players"></tbody></table></div></div></main><script>const demo={online:0,flags:0,kicks:0,bans:0,events:[],players:[]};async function loadData(){let url=document.getElementById('api').value.trim();let d=demo;try{let r=await fetch(url,{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}for(const k of ['online','flags','kicks','bans'])document.getElementById(k).textContent=d[k]??0;document.getElementById('events').innerHTML=(d.events||[]).map(x=>'<tr><td>'+esc(x.time)+'</td><td>'+esc(x.player)+'</td><td><span class="pill">'+esc(x.detection)+'</span></td><td>'+esc(x.action)+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No events</td></tr>';document.getElementById('players').innerHTML=(d.players||[]).map(x=>'<tr><td>'+esc(x.player)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.lastDetection||'—')+'</td><td>'+esc(x.violations??0)+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No player data</td></tr>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadData();setInterval(loadData,10000);</script></body></html>
